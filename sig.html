<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Stackly</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 16px 55px;background:linear-gradient(-45deg,#5b2cff,#8e2de2,#00c6ff,#7f00ff);background-size:400% 400%;animation:bgMove 12s ease infinite}
@keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.back{position:absolute;top:30px;left:40px;color:white;text-decoration:none}
.container{width:400px;padding:36px 40px;border-radius:18px;background:rgba(255,255,255,.15);backdrop-filter:blur(15px);text-align:center}
.logo{width:65px;height:65px;margin:auto auto 15px;border-radius:50%;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}
h2{color:white}.subtitle{color:#ddd;margin-bottom:20px}.input-group{text-align:left;margin-bottom:14px}label{color:white;font-size:13px;display:block;margin-bottom:5px}input,select{width:100%;padding:12px;border-radius:8px;border:none}input:focus,select:focus{outline:2px solid #59b0ff}.password-box{position:relative}.eye{position:absolute;right:12px;top:12px;cursor:pointer}.hint{font-size:11px;color:rgba(255,255,255,.75);margin-top:5px}.strength{height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:7px;overflow:hidden}.strength span{display:block;height:100%;width:0;transition:width .2s,background .2s}button{margin-top:18px;width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#2f6bff,#a200ff);color:white;cursor:pointer}.signin{margin-top:15px;color:white;font-size:13px}.signin a{color:white;text-decoration:underline}.site-footer{position:fixed;bottom:0;left:0;right:0;padding:10px 20px;background:rgba(11,27,51,.72);backdrop-filter:blur(10px);color:rgba(255,255,255,.82);font-size:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}.site-footer a{color:#8ecdff;text-decoration:none;font-weight:600}@media(max-width:450px){.back{left:20px}.container{width:100%;padding:30px 24px}.site-footer{font-size:10px;gap:6px;padding:8px 12px}}






/* Edge / IE */
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
    display: none;
}

/* Chrome, Edge */
input::-webkit-credentials-auto-fill-button,
input::-webkit-password-toggle-button {
    display: none !important;
    visibility: hidden;
    pointer-events: none;
}
















</style>
</head>
<body>
<a href="index.html" class="back">← Back to Home</a>
<div class="container">
  <div class="logo"><img src="logo.webp" alt="Stackly logo"></div>
  <h2>Create Account</h2>
  <p class="subtitle">Join Stackly to access your dashboard</p>
<form onsubmit="redirect404(event)" autocomplete="off">    <div class="input-group"><label for="name">Full Name</label><input id="name" type="text" placeholder="Enter your name" required></div>
    <div class="input-group"><label for="email">Email ID</label><input id="email" type="email" autocomplete="off"placeholder="Enter your email" required>
</div>
    <div class="input-group"><label for="role">Account Type</label><select id="role"><option value="Patient">Patient</option><option value="Admin">Admin</option></select></div>
    <div class="input-group"><label for="password">Password</label><div class="password-box"><input id="password" type="password" autocomplete="new-password"placeholder="Enter your password" required>
<span class="eye" onclick="togglePassword('password', this)">👁</span></div><div class="strength"><span id="strengthBar"></span></div><p class="hint">Use 8+ characters with uppercase, lowercase, and a number.</p></div>
    <div class="input-group"><label for="confirmPassword">Confirm Password</label><div class="password-box"><input id="confirmPassword" type="password" autocomplete="new-password"placeholder="Confirm your password" required><span class="eye" onclick="togglePassword('confirmPassword', this)">👁</span></div></div>
    <button type="submit" data-preserve-action>Create Account</button>
  </form>
  <div class="signin">Already have an account? <a href="login.html">Login</a></div>
</div>
<!-- <footer class="site-footer"><strong>Stackly Care Network</strong><span>Care that stays connected, wherever you are.</span><span>Chinna Thirupathi, Salem, Tamil Nadu</span><a href="tel:9876543211">Call 9876543211</a></footer> -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
const passwordInput = document.getElementById('password');
passwordInput.addEventListener('input', () => {
  const value = passwordInput.value;
  const score = Number(value.length >= 8) + Number(/[A-Z]/.test(value)) + Number(/[a-z]/.test(value)) + Number(/\d/.test(value));
  const bar = document.getElementById('strengthBar');
  bar.style.width = `${score * 25}%`;
  bar.style.background = score < 3 ? '#fbbf24' : score === 3 ? '#34d399' : '#22c55e';
});
function togglePassword(id, eye){const input=document.getElementById(id);input.type=input.type==='password'?'text':'password';eye.textContent=input.type==='password'?'👁':'🙈'}


function redirect404(event){
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(!name || !email || !password || !confirmPassword){
        alert("Please fill all fields");
        return;
    }

    if(password !== confirmPassword){
        alert("Passwords do not match");
        return;
    }

    // அனைத்து field-மும் valid என்றால்
    window.location.href = "login.html";
}



















</script>
<script src="button-links.js"></script>
</body>
</html>
